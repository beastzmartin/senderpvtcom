version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: whatsapp-sender-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=whatsapp-sender-production-super-secret-key-change-me
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    volumes:
      # Crucial: Persists your SQLite database and WhatsApp login session keys across restarts
      - ./server/data:/app/data
