version: '3.8'

services:
  pvtsender:
    build:
      context: .
      dockerfile: Dockerfile
    image: pvtsender:latest
    container_name: pvtsender-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-whatsapp-sender-production-super-secret-key-change-me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-2000}
    volumes:
      # Persists SQLite database and WhatsApp multi-device authentication sessions
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
